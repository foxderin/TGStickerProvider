[versions]
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
material = "1.14.0"
core = "1.17.0"
appcompat = "1.7.1"
recyclerview = "1.4.0"
constraintlayout = "2.2.1"
# Keep the Hook integration pinned; the video codec migration is tracked in docs/parallel-conversion.md.
yuki = "1.2.0"
ffmpeg = "6.0.6"
glide = "5.0.7"
junit = "4.13.2"
androidx-junit = "1.3.0"
espresso = "3.7.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
material = { module = "com.google.android.material:material", version.ref = "material" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
xposed = { module = "de.robv.android.xposed:api", version = "82" }
yuki-api = { module = "com.highcapable.yukihookapi:api", version.ref = "yuki" }
yuki-ksp = { module = "com.highcapable.yukihookapi:ksp-xposed", version.ref = "yuki" }
ffmpeg = { module = "io.github.maitrungduc1410:ffmpeg-kit-video", version.ref = "ffmpeg" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
